# -*- coding: utf-8 -*-
# Словарь алиасов (карточка Ф1.32): обозначение → расшифровка.
# Подстановка ищет норму по расшифровке, когда обозначение на листе
# с нормой не встречается (карта 021.40.00h, РТЭ кн.3 л.64:
# «МВ-1200» на листе нет, но «высота щеток» и «13,5 мм» есть).

[alias]
"МВ-1200" = "электродвигатель вентилятора обогревателя КО-50"
