# Золотой набор — карточка 0.1 (Фаза 0) + дополнение 0.1в. 45 вопросов:
# 16 explain | 11 fault | 18 procedure (incl. 6 refusal).
#
# Формат TOML по согласованию владельца: читается стандартным tomllib
# (Python 3.12); pyyaml НЕ добавляется.
#
# Поля записи (все обязательны): id, mode, status, question,
# aircraft_type, ata, expected_doc, expected_pages, notes.
# status:
#   "todo"  — заглушка: владелец заполняет expected_doc/expected_pages
#             (по 4–5 на документ); в метриках НЕ считается,
#             в отчёте перечисляется отдельным блоком.
#   "ready" — эталон с подтверждёнными ожиданиями (док. tests_manual.md,
#             сессионные прогоны CLI, превью содержимого страниц).
#   Внекорпусный вопрос: status = "ready" с ПУСТЫМИ expected_pages и
#   пустым expected_doc — «должен отказать» (ждаём refuse, а не листы).
# expected_pages — нумерация листов, какую печатает CLI ``ask`` и
# которую хранит граф (столбец pages.page).
# ata — код системы/подсистемы ATA-100; пустая строка, если не задан.

