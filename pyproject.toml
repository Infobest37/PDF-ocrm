[project]
name = "pdfprepare"
version = "0.1.0"
description = "Prepare scanned PDFs: add an OCR text layer, emit per-page JSON structure, and report pages needing a re-scan."
requires-python = ">=3.12"
dependencies = [
    "pymupdf",
    "pytesseract",
    "pillow",
    "numpy",
    "opencv-python-headless",
    "pytest",
]
